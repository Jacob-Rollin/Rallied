name = "rallied-bot"
main = "src/worker.ts"
compatibility_date = "2024-10-01"
# tweetnacl + supabase-js expect Node built-ins on Workers
compatibility_flags = ["nodejs_compat"]
# Tip rebuild nudge: content touch so Workers Builds re-evaluates this Worker path.

# Keep dashboard Runtime variables/secrets across `wrangler deploy`.
# Plaintext public values can still live in [vars]; secrets stay in dashboard Secrets.
# Without keep_vars, CI deploy clears dashboard bindings not listed in this file.
keep_vars = true

# Set secrets via: wrangler secret put DISCORD_PUBLIC_KEY
#                  wrangler secret put DISCORD_BOT_TOKEN
#                  wrangler secret put DISCORD_APP_ID
#                  wrangler secret put SUPABASE_URL
#                  wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Optional (phone register): wrangler secret put REGISTER_COMMANDS_SECRET
# Optional guild for /register-commands: wrangler secret put DISCORD_DEV_GUILD_ID
#   (or set as a plain var in the CF dashboard — not committed here)

# Expire stale open parties + finalize ready-check grace (every 5 minutes).
[triggers]
crons = ["*/5 * * * *"]
