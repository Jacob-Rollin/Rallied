# Rallied website (Next.js → Cloudflare Workers via OpenNext)
# Deploy from this package: npm run deploy:cf  (or from repo root: npm run deploy:web)
# Bot Worker config stays in apps/bot/wrangler.toml — separate CF project.

name = "rallied-web"
main = ".open-next/worker.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Keep dashboard Runtime variables/secrets across `wrangler deploy`.
# Plaintext public values can still live in [vars]; secrets stay in dashboard Secrets.
# Without keep_vars, CI deploy clears dashboard bindings not listed in this file.
# Deploy scripts also pass --keep-vars (see package.json deploy:cf / deploy:cf:full).
keep_vars = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Optional: incremental cache via R2 (uncomment + create bucket)
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "rallied-web-cache"

# Secrets / vars (Cloudflare dashboard → Worker → Settings → Variables and Secrets).
# Redeploy after setting so OpenNext/runtime picks them up.
#
# Required for OAuth + session:
#   NEXT_PUBLIC_DISCORD_CLIENT_ID
#   DISCORD_CLIENT_ID
#   DISCORD_CLIENT_SECRET
#   DISCORD_REDIRECT_URI
#   SESSION_SECRET
#   NEXT_PUBLIC_APP_URL
#
# Required for live dashboard (real guild → Supabase):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   (public; RLS still denies table reads)
#   SUPABASE_SERVICE_ROLE_KEY      (SECRET — server-only admin reads; never NEXT_PUBLIC_)
#
# Optional bot_present detection:
#   DISCORD_BOT_TOKEN              (SECRET — bot guild list)
#   Without it, web uses `servers.discord_guild_id` via service role after bot upserts.
#
# Stripe billing (Phase B — test mode first):
#   STRIPE_SECRET_KEY              (SECRET — sk_test_… then sk_live_…)
#   STRIPE_WEBHOOK_SECRET          (SECRET — whsec_… for /api/stripe/webhook)
#   STRIPE_PRICE_COMMUNITY_MONTHLY / _YEARLY
#   STRIPE_PRICE_PRO_MONTHLY / _YEARLY
#   STRIPE_PRICE_FOUNDING_PRO_MONTHLY (/ _YEARLY optional)
#   Legacy aliases: STRIPE_PRICE_COMMUNITY, STRIPE_PRICE_PRO, STRIPE_PRICE_FOUNDING_PRO
